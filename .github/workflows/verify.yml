name: Verify production system

"on":
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "inventory/**"
      - "consolidation/**"

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verification:
    name: Combined checks and Python package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AMP_TEST_FONT: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      AMP_NODE_MODULES: ${{ github.workspace }}/node_modules
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-direction.txt

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Install declared verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check --no-input setuptools==84.0.0 wheel==0.48.0
          python -m pip install --disable-pip-version-check --no-input --no-build-isolation --editable . --requirement requirements-direction.txt
          npm ci --ignore-scripts --no-audit --no-fund
          test -s "$AMP_TEST_FONT"
          ffmpeg -version
          ffprobe -version

      # This entry point discovers Python tests and runs every retained Node
      # suite. Dispatcher additions to tools/check.py use this same gate.
      # Tests use temporary/synthetic fixtures, without private source media,
      # provider credentials, model downloads, or production publication.
      # Installed-wheel preflights exercise the native FX canvas dependency
      # outside the source checkout as well as the built-in Node test runner.
      - name: Run the complete project checks
        env:
          PIP_NO_INDEX: "1"
        run: python tools/check.py

      - name: Build the Python distribution without network resolution
        run: |
          python -m pip wheel --disable-pip-version-check --no-index --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/god-here-wheel" .
