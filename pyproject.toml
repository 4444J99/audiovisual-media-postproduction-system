[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiovisual-media-postproduction-system"
version = "0.2.0"
description = "Source-addressable audiovisual composition and postproduction"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "Pillow>=9"]

[project.optional-dependencies]
learned = ["onnxruntime>=1.16", "opencv-python-headless>=4.8"]
tracking = ["opencv-python-headless>=4.8,<6"]

[project.scripts]
amp = "amp.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["amp", "amp.*"]
namespaces = false
